<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hactl ST1 Live Tour & AI Translation</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --primary: #004b87;
      --accent: #00897b;
      --bg: #f8fafc;
      --card: #ffffff;
      --danger: #d32f2f;
      --text: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 440px; }
    .card { background: var(--card); border-radius: 14px; padding: 22px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); margin-bottom: 16px; border: 1px solid #e2e8f0; }
    .header { text-align: center; margin-bottom: 18px; }
    .header h2 { font-size: 1.25rem; color: var(--primary); }
    .header p { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
    .hidden { display: none !important; }
    .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-accent { background: var(--accent); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .input-field { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; background: white; }
    .status-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; background: #fee2e2; color: #b91c1c; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #b91c1c; margin-right: 6px; animation: pulse 1.2s infinite; }
    
    /* Live Subtitle Transcript Window */
    .subtitle-box {
      background: #0f172a;
      color: #38bdf8;
      border-radius: 10px;
      padding: 14px;
      min-height: 85px;
      max-height: 130px;
      overflow-y: auto;
      font-size: 1.05rem;
      line-height: 1.5;
      font-weight: 500;
      margin: 12px 0;
      border: 1px solid #1e293b;
    }
    .original-text { font-size: 0.78rem; color: #94a3b8; margin-bottom: 4px; }

    .vu-meter-wrap { width: 100%; background: #e2e8f0; height: 14px; border-radius: 8px; overflow: hidden; margin: 10px 0; }
    .vu-meter-bar { width: 0%; height: 100%; background: #10b981; transition: width 0.05s linear; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Hactl SuperTerminal 1</h2>
      <p>Live Audio Tour & Instant AI Translation</p>
    </div>

    <!-- View 1: Role Selection -->
    <div id="view-role" class="card">
      <h3 style="font-size: 1.05rem; margin-bottom: 14px; text-align: center;">Select Your Role</h3>
      <button class="btn btn-primary" onclick="showAudienceView()">🎧 Audience / Visitor</button>
      <button class="btn btn-accent" style="margin-top: 12px;" onclick="showGuideAuthView()">🎤 Tour Guide Login</button>
    </div>

    <!-- View 2: Guide Setup -->
    <div id="view-guide-auth" class="card hidden">
      <h3 style="font-size: 1.05rem; margin-bottom: 12px;">Tour Guide Setup</h3>
      <label style="font-size: 0.85rem; font-weight: 600;">Tour Guide Passcode</label>
      <input type="password" id="guide-passcode" class="input-field" placeholder="Enter Passcode" />

      <label style="font-size: 0.85rem; font-weight: 600;">Channel Number</label>
      <input type="number" id="guide-channel-no" class="input-field" value="1" />

      <label style="font-size: 0.85rem; font-weight: 600;">Spoken Language (Your Voice)</label>
      <select id="guide-spoken-lang" class="input-field">
        <option value="en-US">English</option>
        <option value="zh-HK">Cantonese (粵語)</option>
        <option value="zh-CN">Mandarin (普通話)</option>
      </select>

      <button id="btn-start" class="btn btn-accent" onclick="startBroadcaster()">🚀 Start Broadcast & AI Captions</button>
      <button class="btn" style="background:#e2e8f0; margin-top:8px;" onclick="resetViews()">Back</button>
    </div>

    <!-- View 3: Guide Dashboard (On Air) -->
    <div id="view-guide-live" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
        <span class="status-badge"><span class="live-dot"></span>LIVE ON AIR</span>
        <span id="guide-listeners" style="font-size: 0.85rem; font-weight: 600; color: #475569;">0 Connected</span>
      </div>
      <h3 id="guide-ch-title" style="color: var(--primary); margin-bottom: 6px;"></h3>
      
      <div class="vu-meter-wrap">
        <div id="mic-meter-bar" class="vu-meter-bar"></div>
      </div>

      <label style="font-size: 0.8rem; font-weight: 600; color: #64748b;">Live Speech Recognition:</label>
      <div class="subtitle-box" id="guide-caption-box">Speaking into mic...</div>

      <button id="btn-mute" class="btn btn-primary" onclick="toggleMute()">🎙️ Mute Microphone</button>
      <button class="btn btn-danger" onclick="endTour()">⏹️ End Tour</button>
    </div>

    <!-- View 4: Audience Join -->
    <div id="view-audience-join" class="card hidden">
      <h3 style="font-size: 1.05rem; margin-bottom: 12px;">Join Tour Channel</h3>
      <label style="font-size: 0.85rem; font-weight: 600;">Channel Number</label>
      <input type="number" id="audience-channel-no" class="input-field" value="1" />

      <!-- Language Dropdown -->
      <label style="font-size: 0.85rem; font-weight: 600;">Choose Your Preferred Language</label>
      <select id="audience-lang-select" class="input-field">
        <option value="en">English</option>
        <option value="zh-TW">Traditional Chinese (繁體中文)</option>
        <option value="zh-CN">Simplified Chinese (简体中文)</option>
        <option value="ja">Japanese (日本語)</option>
        <option value="ko">Korean (한국어)</option>
        <option value="es">Spanish (Español)</option>
        <option value="fr">French (Français)</option>
        <option value="de">German (Deutsch)</option>
      </select>

      <button id="btn-join" class="btn btn-primary" onclick="joinChannel()">🎧 Connect & Listen</button>
      <button class="btn" style="background:#e2e8f0; margin-top:8px;" onclick="resetViews()">Back</button>
    </div>

    <!-- View 5: Audience Receiver Player & Live Translated Captions -->
    <div id="view-audience-player" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
        <span class="status-badge" style="background:#dcfce7; color:#15803d;">CONNECTED</span>
        <span id="selected-lang-tag" style="font-size: 0.8rem; font-weight: 700; color: #0284c7;">EN</span>
      </div>
      <h3 id="audience-ch-title" style="color: var(--primary); margin-bottom: 4px;"></h3>
      <p id="visitor-status" style="font-size: 0.85rem; color: #64748b; margin-bottom: 10px;">Awaiting audio stream...</p>

      <!-- Audio Element -->
      <audio id="remote-audio" playsinline webkit-playsinline controls style="width: 100%; margin-bottom: 10px;"></audio>

      <!-- Dynamic AI Live Subtitles -->
      <label style="font-size: 0.8rem; font-weight: 700; color: #334155;">AI Instant Translation Subtitles:</label>
      <div class="subtitle-box">
        <div id="sub-original" class="original-text">Guide's speech will translate here...</div>
        <div id="sub-translated">Waiting for tour guide to speak...</div>
      </div>

      <button id="btn-audio-unmute" class="btn btn-accent" onclick="forcePlayAudio()">🔊 Tap to Turn On Sound</button>
      <button class="btn btn-danger" style="margin-top:10px;" onclick="location.reload()">Leave Channel</button>
    </div>
  </div>

  <script>
    const PASSCODE = "P18825-20261120";
    const PREFIX = "hactl-st1-ch";

    let peer = null;
    let localStream = null;
    let isMuted = false;
    let connectedVisitors = {};
    let speechRecognizer = null;
    let selectedAudienceLang = "en";

    function hideAll() {
      ['view-role', 'view-guide-auth', 'view-guide-live', 'view-audience-join', 'view-audience-player'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
    }
    function resetViews() { hideAll(); document.getElementById('view-role').classList.remove('hidden'); }
    function showGuideAuthView() { hideAll(); document.getElementById('view-guide-auth').classList.remove('hidden'); }
    function showAudienceView() { hideAll(); document.getElementById('view-audience-join').classList.remove('hidden'); }

    // --- Tour Guide Logic ---
    async function startBroadcaster() {
      const code = document.getElementById('guide-passcode').value.trim();
      const chNum = document.getElementById('guide-channel-no').value.trim() || '1';
      const spokenLang = document.getElementById('guide-spoken-lang').value;
      const startBtn = document.getElementById('btn-start');

      if (code !== PASSCODE) return alert('Invalid Passcode!');

      startBtn.disabled = true;
      startBtn.innerText = "Accessing Microphone & AI...";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false
        });
      } catch (err) {
        startBtn.disabled = false;
        startBtn.innerText = "🚀 Start Broadcast & AI Captions";
        alert("Microphone Error: " + err.message);
        return;
      }

      attachVUMeter(localStream);
      startSpeechRecognition(spokenLang);

      const guidePeerId = `${PREFIX}-${chNum}`;
      peer = new Peer(guidePeerId, {
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
      });

      peer.on('open', () => {
        hideAll();
        document.getElementById('view-guide-live').classList.remove('hidden');
        document.getElementById('guide-ch-title').innerText = `Channel ${chNum}`;
      });

      peer.on('error', (err) => {
        startBtn.disabled = false;
        startBtn.innerText = "🚀 Start Broadcast & AI Captions";
        if (err.type === 'unavailable-id') alert(`Channel ${chNum} is already active!`);
        else alert('Connection Error: ' + err.type);
      });

      peer.on('connection', (dataConn) => {
        dataConn.on('open', () => {
          const visitorId = dataConn.peer;
          const mediaCall = peer.call(visitorId, localStream);
          connectedVisitors[visitorId] = { dataConn, mediaCall };
          updateListenerCount();

          dataConn.on('close', () => {
            delete connectedVisitors[visitorId];
            updateListenerCount();
          });
        });
      });
    }

    // Live Voice Recognition on Guide's Phone
    function startSpeechRecognition(lang) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        console.warn("Speech Recognition API not supported on this browser.");
        return;
      }

      speechRecognizer = new SpeechRecognition();
      speechRecognizer.continuous = true;
      speechRecognizer.interimResults = true;
      speechRecognizer.lang = lang;

      speechRecognizer.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }

        document.getElementById('guide-caption-box').innerText = transcript;

        // Broadcast raw text to all connected audience data channels
        Object.values(connectedVisitors).forEach(visitor => {
          if (visitor.dataConn && visitor.dataConn.open) {
            visitor.dataConn.send({ type: 'caption', text: transcript, srcLang: lang.split('-')[0] });
          }
        });
      };

      speechRecognizer.onerror = (e) => {
        console.log("Speech recognition notice:", e.error);
      };

      speechRecognizer.onend = () => {
        // Automatically restart speech recognizer if guide is still broadcasting
        if (localStream) speechRecognizer.start();
      };

      speechRecognizer.start();
    }

    function attachVUMeter(stream) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const source = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 64;
      source.connect(analyser);

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      const meterBar = document.getElementById('mic-meter-bar');

      function update() {
        if (!localStream) return;
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        let percent = Math.min(100, Math.round((sum / dataArray.length / 128) * 100));
        if (meterBar) meterBar.style.width = percent + '%';
        requestAnimationFrame(update);
      }
      update();
    }

    function updateListenerCount() {
      const el = document.getElementById('guide-listeners');
      const count = Object.keys(connectedVisitors).length;
      if (el) el.innerText = `${count} Connected`;
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      const btn = document.getElementById('btn-mute');
      btn.innerText = isMuted ? '🔇 Unmute Microphone' : '🎙️ Mute Microphone';
      btn.style.background = isMuted ? '#d32f2f' : 'var(--primary)';
    }

    function endTour() {
      if (speechRecognizer) speechRecognizer.stop();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peer) peer.destroy();
      location.reload();
    }

    // --- Audience Logic ---
    let globalIncomingStream = null;

    function joinChannel() {
      const chNum = document.getElementById('audience-channel-no').value.trim() || '1';
      selectedAudienceLang = document.getElementById('audience-lang-select').value;
      const targetGuideId = `${PREFIX}-${chNum}`;
      const joinBtn = document.getElementById('btn-join');

      joinBtn.disabled = true;
      joinBtn.innerText = "Connecting...";

      peer = new Peer(null, {
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
      });

      peer.on('open', (id) => {
        const conn = peer.connect(targetGuideId, { reliable: true });

        conn.on('open', () => {
          hideAll();
          document.getElementById('view-audience-player').classList.remove('hidden');
          document.getElementById('audience-ch-title').innerText = `Channel ${chNum}`;
          document.getElementById('selected-lang-tag').innerText = selectedAudienceLang.toUpperCase();
        });

        // Receive real-time transcript from Guide
        conn.on('data', async (data) => {
          if (data.type === 'caption') {
            document.getElementById('sub-original').innerText = `Guide: "${data.text}"`;
            
            // Translate live text if visitor language differs from guide language
            if (data.srcLang === selectedAudienceLang) {
              document.getElementById('sub-translated').innerText = data.text;
            } else {
              translateText(data.text, data.srcLang, selectedAudienceLang);
            }
          }
        });

        conn.on('close', () => {
          alert('Tour guide has ended this session.');
          location.reload();
        });
      });

      peer.on('call', (incomingCall) => {
        incomingCall.answer();
        incomingCall.on('stream', (audioStream) => {
          globalIncomingStream = audioStream;
          const audioEl = document.getElementById('remote-audio');
          audioEl.srcObject = audioStream;
          audioEl.play().then(() => {
            document.getElementById('visitor-status').innerText = '🟢 Playing live audio from Tour Guide';
            document.getElementById('btn-audio-unmute').style.display = 'none';
          }).catch(() => {
            document.getElementById('btn-audio-unmute').style.display = 'block';
          });
        });
      });
    }

    // Instant Translation Engine using standard fast translation endpoint
    async function translateText(text, fromLang, toLang) {
      if (!text || text.trim() === "") return;
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`);
        const data = await res.json();
        if (data && data.responseData && data.responseData.translatedText) {
          document.getElementById('sub-translated').innerText = data.responseData.translatedText;
        }
      } catch (err) {
        document.getElementById('sub-translated').innerText = text; // Fallback to raw text
      }
    }

    function forcePlayAudio() {
      const audioEl = document.getElementById('remote-audio');
      if (globalIncomingStream) audioEl.srcObject = globalIncomingStream;
      audioEl.play().then(() => {
        document.getElementById('visitor-status').innerText = '🟢 Playing live audio';
        document.getElementById('btn-audio-unmute').style.display = 'none';
      });
    }
  </script>
</body>
</html>
