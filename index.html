<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hactl ST1 Tour Audio</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --primary: #004b87;
      --accent: #00897b;
      --bg: #f8fafc;
      --card: #ffffff;
      --danger: #d32f2f;
      --text: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 420px; }
    .card { background: var(--card); border-radius: 14px; padding: 22px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); margin-bottom: 16px; border: 1px solid #e2e8f0; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { font-size: 1.25rem; color: var(--primary); }
    .header p { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
    .hidden { display: none !important; }
    .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-accent { background: var(--accent); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .input-field { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    .status-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; background: #fee2e2; color: #b91c1c; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #b91c1c; margin-right: 6px; animation: pulse 1.2s infinite; }
    .vu-meter-wrap { width: 100%; background: #e2e8f0; height: 16px; border-radius: 8px; overflow: hidden; margin: 12px 0; }
    .vu-meter-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #10b981 60%, #f59e0b 85%, #ef4444 100%); transition: width 0.05s linear; }
    .status-text { font-size: 0.85rem; color: #475569; margin: 10px 0; text-align: center; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Hactl SuperTerminal 1</h2>
      <p>Live Audio Tour Broadcast</p>
    </div>

    <!-- Step 1: Select Role -->
    <div id="view-role" class="card">
      <h3 style="font-size: 1.05rem; margin-bottom: 14px; text-align: center;">Select Your Role</h3>
      <button class="btn btn-primary" onclick="showAudienceView()">🎧 Audience / Visitor</button>
      <button class="btn btn-accent" style="margin-top: 12px;" onclick="showGuideAuthView()">🎤 Tour Guide Login</button>
    </div>

    <!-- Step 2: Guide Setup -->
    <div id="view-guide-auth" class="card hidden">
      <h3 style="font-size: 1.05rem; margin-bottom: 12px;">Tour Guide Setup</h3>
      <label style="font-size: 0.85rem; font-weight: 600;">Tour Guide Passcode</label>
      <input type="password" id="guide-passcode" class="input-field" placeholder="Enter Passcode" />

      <label style="font-size: 0.85rem; font-weight: 600;">Channel Number</label>
      <input type="number" id="guide-channel-no" class="input-field" value="1" />

      <label style="font-size: 0.85rem; font-weight: 600;">Tour Name</label>
      <input type="text" id="guide-tour-name" class="input-field" placeholder="e.g. VIP Cargo Delegation" />

      <button id="btn-start" class="btn btn-accent" onclick="startBroadcaster()">🚀 Start Broadcast</button>
      <button class="btn" style="background:#e2e8f0; margin-top:8px;" onclick="resetViews()">Back</button>
    </div>

    <!-- Step 3: Guide Dashboard (On Air) -->
    <div id="view-guide-live" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
        <span class="status-badge"><span class="live-dot"></span>LIVE ON AIR</span>
        <span id="guide-listeners" style="font-size: 0.85rem; font-weight: 600; color: #475569;">0 Connected</span>
      </div>
      <h3 id="guide-ch-title" style="color: var(--primary); margin-bottom: 8px;"></h3>
      
      <label style="font-size: 0.8rem; color: #64748b; font-weight: 600;">Microphone Input Level:</label>
      <div class="vu-meter-wrap">
        <div id="mic-meter-bar" class="vu-meter-bar"></div>
      </div>
      <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 16px;">Green bar will bounce when you speak.</p>

      <button id="btn-mute" class="btn btn-primary" onclick="toggleMute()">🎙️ Mute Microphone</button>
      <button class="btn btn-danger" onclick="endTour()">⏹️ End Tour</button>
    </div>

    <!-- Step 4: Audience Join -->
    <div id="view-audience-join" class="card hidden">
      <h3 style="font-size: 1.05rem; margin-bottom: 12px;">Join Tour Channel</h3>
      <label style="font-size: 0.85rem; font-weight: 600;">Channel Number</label>
      <input type="number" id="audience-channel-no" class="input-field" value="1" />
      <button id="btn-join" class="btn btn-primary" onclick="joinChannel()">🎧 Connect & Listen</button>
      <button class="btn" style="background:#e2e8f0; margin-top:8px;" onclick="resetViews()">Back</button>
    </div>

    <!-- Step 5: Audience Receiver Player -->
    <div id="view-audience-player" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px;">
        <span class="status-badge" style="background:#dcfce7; color:#15803d;">CONNECTED</span>
      </div>
      <h3 id="audience-ch-title" style="color: var(--primary); margin-bottom: 6px;"></h3>
      <p id="visitor-status" class="status-text">Establishing audio link...</p>

      <!-- Standard HTML Audio element with visible system controls for iOS Safari reliability -->
      <audio id="remote-audio" playsinline webkit-playsinline controls style="width: 100%; margin: 12px 0;"></audio>

      <button id="btn-audio-unmute" class="btn btn-accent" onclick="forcePlayAudio()">🔊 Tap to Turn On Sound</button>

      <button class="btn btn-danger" style="margin-top:14px;" onclick="location.reload()">Leave Channel</button>
    </div>
  </div>

  <script>
    const PASSCODE = "P18825-20261120";
    const PREFIX = "hactl-st1-ch";

    let peer = null;
    let localStream = null;
    let isMuted = false;
    let connectedVisitors = {}; // Stores visitor references

    function hideAll() {
      ['view-role', 'view-guide-auth', 'view-guide-live', 'view-audience-join', 'view-audience-player'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
    }
    function resetViews() { hideAll(); document.getElementById('view-role').classList.remove('hidden'); }
    function showGuideAuthView() { hideAll(); document.getElementById('view-guide-auth').classList.remove('hidden'); }
    function showAudienceView() { hideAll(); document.getElementById('view-audience-join').classList.remove('hidden'); }

    // --- Tour Guide Logic ---
    async function startBroadcaster() {
      const code = document.getElementById('guide-passcode').value.trim();
      const chNum = document.getElementById('guide-channel-no').value.trim() || '1';
      const tourName = document.getElementById('guide-tour-name').value.trim() || 'ST1 Tour';
      const startBtn = document.getElementById('btn-start');

      if (code !== PASSCODE) return alert('Invalid Passcode!');

      startBtn.disabled = true;
      startBtn.innerText = "Accessing Microphone...";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
      } catch (err) {
        startBtn.disabled = false;
        startBtn.innerText = "🚀 Start Broadcast";
        alert("Microphone Error: " + err.message);
        return;
      }

      attachVUMeter(localStream);

      const guidePeerId = `${PREFIX}-${chNum}`;
      peer = new Peer(guidePeerId, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' }
          ]
        }
      });

      peer.on('open', () => {
        hideAll();
        document.getElementById('view-guide-live').classList.remove('hidden');
        document.getElementById('guide-ch-title').innerText = `Channel ${chNum} - ${tourName}`;
      });

      peer.on('error', (err) => {
        startBtn.disabled = false;
        startBtn.innerText = "🚀 Start Broadcast";
        if (err.type === 'unavailable-id') {
          alert(`Channel ${chNum} is already active! Choose another channel number.`);
        } else {
          alert('Connection Error: ' + err.type);
        }
      });

      // KEY ARCHITECTURE FIX: Guide listens for visitor registrations, then CALLS the visitor with real audio
      peer.on('connection', (dataConn) => {
        dataConn.on('open', () => {
          const visitorPeerId = dataConn.peer;
          // Immediately stream local mic to the visitor
          const mediaCall = peer.call(visitorPeerId, localStream);
          connectedVisitors[visitorPeerId] = { dataConn, mediaCall };
          updateListenerCount();

          dataConn.on('close', () => {
            delete connectedVisitors[visitorPeerId];
            updateListenerCount();
          });
        });
      });
    }

    function attachVUMeter(stream) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const source = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 64;
      source.connect(analyser);

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      const meterBar = document.getElementById('mic-meter-bar');

      function update() {
        if (!localStream) return;
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        let percent = Math.min(100, Math.round((sum / dataArray.length / 128) * 100));
        if (meterBar) meterBar.style.width = percent + '%';
        requestAnimationFrame(update);
      }
      update();
    }

    function updateListenerCount() {
      const el = document.getElementById('guide-listeners');
      const count = Object.keys(connectedVisitors).length;
      if (el) el.innerText = `${count} Connected`;
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      const btn = document.getElementById('btn-mute');
      btn.innerText = isMuted ? '🔇 Unmute Microphone' : '🎙️ Mute Microphone';
      btn.style.background = isMuted ? '#d32f2f' : 'var(--primary)';
    }

    function endTour() {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peer) peer.destroy();
      location.reload();
    }

    // --- Audience Logic ---
    let audienceAudioCtx = null;
    let globalIncomingStream = null;

    function joinChannel() {
      const chNum = document.getElementById('audience-channel-no').value.trim() || '1';
      const targetGuideId = `${PREFIX}-${chNum}`;
      const joinBtn = document.getElementById('btn-join');

      joinBtn.disabled = true;
      joinBtn.innerText = "Connecting...";

      // Random unique ID for visitor
      peer = new Peer(null, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' }
          ]
        }
      });

      peer.on('open', (visitorId) => {
        // 1. Establish stable DataConnection to announce arrival to the guide
        const conn = peer.connect(targetGuideId, { reliable: true });

        conn.on('open', () => {
          hideAll();
          document.getElementById('view-audience-player').classList.remove('hidden');
          document.getElementById('audience-ch-title').innerText = `Listening to Channel ${chNum}`;
          document.getElementById('visitor-status').innerText = 'Connected to guide. Awaiting audio stream...';
        });

        conn.on('close', () => {
          alert('Tour guide has ended this session.');
          location.reload();
        });

        conn.on('error', () => {
          joinBtn.disabled = false;
          joinBtn.innerText = "🎧 Connect & Listen";
          alert('Could not connect to Channel ' + chNum + '. Ensure the tour guide is on air.');
        });
      });

      // 2. Guide calls this visitor with the real audio stream
      peer.on('call', (incomingCall) => {
        // Answer without any local stream (true receive-only mode)
        incomingCall.answer();

        incomingCall.on('stream', (audioStream) => {
          globalIncomingStream = audioStream;
          document.getElementById('visitor-status').innerText = 'Audio stream received! Tap button below to unmute.';
          
          const audioEl = document.getElementById('remote-audio');
          audioEl.srcObject = audioStream;

          // Try immediate autoplay
          audioEl.play().then(() => {
            document.getElementById('visitor-status').innerText = '🟢 Playing live audio from Tour Guide';
            document.getElementById('btn-audio-unmute').style.display = 'none';
          }).catch(() => {
            // Safari autoplay policy requires manual tap
            document.getElementById('btn-audio-unmute').style.display = 'block';
          });
        });
      });

      peer.on('error', (err) => {
        joinBtn.disabled = false;
        joinBtn.innerText = "🎧 Connect & Listen";
        alert('Channel ' + chNum + ' not found or offline.');
      });
    }

    function forcePlayAudio() {
      // Unlock Web Audio context on iOS tap
      if (!audienceAudioCtx) {
        audienceAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audienceAudioCtx.state === 'suspended') {
        audienceAudioCtx.resume();
      }

      const audioEl = document.getElementById('remote-audio');
      if (globalIncomingStream && audioEl.srcObject !== globalIncomingStream) {
        audioEl.srcObject = globalIncomingStream;
      }

      audioEl.play().then(() => {
        document.getElementById('visitor-status').innerText = '🟢 Playing live audio from Tour Guide';
        document.getElementById('btn-audio-unmute').style.display = 'none';
      }).catch(err => {
        alert('Safari Playback Error: ' + err.message + '\n\nPlease tap the play icon directly on the player.');
      });
    }
  </script>
</body>
</html>
